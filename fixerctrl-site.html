<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixerCtrl | Cybersecurity and development</title>
<meta name="description" content="FixerCtrl: a young South African township-raised IT student sharing practical cybersecurity, systems and software work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --bg-2: #121212;
    --fg: #F2F2F2;
    --muted: #D8D8D8;
    --line: rgba(242, 242, 242, 0.18);
    --surface: #141414;
    --surface-strong: #171717;
    --field: #1B1B1B;
    --accent: #00B4FF;
    --accent-2: #00B4FF;
    --accent-3: #00B4FF;
    --link: #00B4FF;
    --focus: #00B4FF;
    --btn-border: rgba(0, 180, 255, 0.8);
    --term-bg: rgba(10, 10, 10, 0.96);
    --term-fg: #F2F2F2;
    --term-dim: #D1D1D1;
    --term-line: rgba(242, 242, 242, 0.15);
    --shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    --font: "Inter", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
    --heading: "Anton", "Arial Narrow", sans-serif;
    --marker: "Permanent Marker", cursive;
    --wide: 1120px;
    --gutter: clamp(1rem, 4vw, 2rem);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font); font-size: 1.0625rem; line-height: 1.65;
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(242,242,242,0.09) 0.65px, transparent 0.8px), radial-gradient(rgba(242,242,242,0.045) 0.65px, transparent 0.8px);
    background-position: 0 0, 9px 11px; background-size: 19px 19px; opacity: 0.22; mix-blend-mode: screen;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(168deg, transparent 0 31px, rgba(242,242,242,0.025) 32px, transparent 33px 77px),
      radial-gradient(circle at 12% 10%, rgba(242,242,242,0.08) 0 1.4px, transparent 1.6px 100%),
      radial-gradient(circle at 82% 18%, rgba(242,242,242,0.08) 0 1.2px, transparent 1.4px 100%),
      radial-gradient(circle at 24% 76%, rgba(242,242,242,0.07) 0 1.3px, transparent 1.5px 100%);
    background-size: 100% 100%, 14rem 14rem, 14rem 14rem, 14rem 14rem; opacity: 0.18;
  }
  main { flex: 1; }
  main:focus { outline: none; }
  .wrap { max-width: var(--wide); margin: 0 auto; padding-inline: var(--gutter); }

  h1, h2, h3 { line-height: .96; letter-spacing: 0.02em; margin: 0 0 .7em; font-family: var(--heading); text-transform: uppercase; }
  h1 { font-size: clamp(2.7rem, 2rem + 3.6vw, 6rem); }
  h2 { font-size: clamp(1.7rem, 1.3rem + 1.2vw, 2.8rem); }
  h3 { font-size: clamp(1.2rem, 0.9rem + 0.8vw, 1.7rem); }
  p { margin: 0 0 1em; }
  a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  code, pre, .mono, .tag, .meta, .status, .episode-meta, .label { font-family: var(--mono); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  ul, ol { padding-left: 1.25rem; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  .skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: #000; padding: .6rem 1rem; z-index: 50; font-weight: 700; }
  .skip:focus { left: 0; }

  /* Header */
  .site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(10, 10, 10, 0.96); border-bottom: 1px solid var(--line); }
  .bar { max-width: var(--wide); margin: 0 auto; padding: .8rem var(--gutter); display: flex; align-items: center; gap: 1rem; }
  .brand { font-family: var(--marker); font-size: 1.8rem; line-height: 1; letter-spacing: .03em; color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: .2em; }
  .brand:hover { text-decoration: none; }
  .brand img { display: block; height: clamp(2.5rem, 4vw, 5.5rem); width: auto; max-width: min(100%, 32rem); object-fit: contain; }
  .brand .cur { display: inline-block; width: .55em; height: .17em; background: var(--accent); box-shadow: 0 0 12px rgba(0, 180, 255, 0.55); margin-bottom: .22em; }
  .main-nav { margin-left: auto; }
  .main-nav ul { list-style: none; display: flex; gap: .15rem; margin: 0; padding: 0; }
  .main-nav a { display: block; padding: .55rem .9rem; color: var(--fg); text-decoration: none; border-radius: 2px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: .78rem; transition: background .2s ease, color .2s ease, box-shadow .2s ease; }
  .main-nav a:hover { background: rgba(0, 180, 255, 0.08); }
  .main-nav a[aria-current="page"] { background: rgba(0, 180, 255, 0.12); box-shadow: inset 0 0 0 1px rgba(0, 180, 255, 0.28); text-decoration: none; }
  .tools { display: flex; gap: .25rem; }
  .icon-btn { width: 2.5rem; height: 2.5rem; display: inline-grid; place-items: center; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
  .icon-btn:hover { background: rgba(0, 180, 255, 0.08); border-color: var(--accent); }
  .menu-btn { display: none; }
  .menu-btn .x { display: none; }
  .site-header.open .menu-btn .bars { display: none; }
  .site-header.open .menu-btn .x { display: block; }
  @media (max-width: 780px) {
    .menu-btn { display: inline-grid; }
    .tools { margin-left: auto; }
    .main-nav { display: none; margin: 0; position: absolute; left: 0; right: 0; top: 100%; background: var(--bg); border-bottom: 1px solid var(--line); padding: .5rem var(--gutter) 1rem; }
    .site-header.open .main-nav { display: block; }
    .main-nav ul { flex-direction: column; }
    .main-nav a { padding: .75rem .5rem; }
  }

  /* Buttons */
    .btn { display: inline-block; font: inherit; font-weight: 700; padding: .8rem 1.3rem; border-radius: 2px; text-decoration: none; cursor: pointer;
      border: 1px solid var(--btn-border); background: var(--accent); color: #0A0A0A; box-shadow: 3px 3px 0 rgba(242, 242, 242, 0.22); }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); text-decoration: none; }
    .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); box-shadow: none; }
    .btn.ghost:hover { background: rgba(0, 180, 255, 0.06); }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
  .linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; }

  /* Hero */
  .hero {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    min-height: clamp(38rem, 72vh, 54rem);
    display: flex;
    align-items: center;
    background: #0A0A0A;
    color: #F2F2F2;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, rgba(10,10,10,0) 40%, rgba(10,10,10,.16) 50%, rgba(10,10,10,.82) 68%, #0A0A0A 76%); }
  .hero-figure { position: absolute; inset: 0; min-height: 0; padding: 0; }
  .hero-banner-art { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  .hero-copy {
    position: relative; z-index: 3;
    width: min(44%, 48rem);
    margin: 0 3% 0 auto;
    padding: clamp(3rem, 6vw, 5.5rem) clamp(1rem, 2vw, 2rem);
  }
  .hero-copy h1 { font-size: clamp(2.4rem, 4.3vw, 5rem); }
  .hero-copy .lead { color: #D8D8D8; }
  .hero-copy .btn.ghost, .hero-copy .social-pill, .hero .floating-badge { color: #F2F2F2; }
  .eyebrow { display: inline-flex; align-items: center; gap: .5rem; padding: .35rem .7rem; margin: 0 0 1rem; border: 1px solid rgba(0, 180, 255, 0.48); background: rgba(0, 180, 255, 0.06); border-radius: 2px; color: var(--accent); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  .eyebrow::before { content: ""; width: .48rem; height: .48rem; background: var(--accent); }
  .lead { font-size: 1.18rem; color: var(--muted); max-width: 36rem; }
  .social-strip { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.2rem; }
  .social-pill { display: inline-flex; align-items: center; justify-content: center; min-height: 2.5rem; padding: .55rem .9rem; border-radius: 2px; border: 1px solid var(--line); background: transparent; color: var(--fg); text-decoration: none; font-weight: 600; }
  .social-pill:hover { border-color: var(--accent); background: rgba(0, 180, 255, 0.06); text-decoration: none; }
  .floating-badge {
    position: absolute; right: clamp(1rem, 3vw, 2rem); bottom: clamp(1rem, 3vw, 2rem); display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: .6rem .8rem; border-radius: 2px; background: rgba(10, 10, 10, 0.92); border: 1px solid var(--line);
    color: var(--fg); font-weight: 700; font-size: .9rem; z-index: 2;
  }
  .floating-badge span { color: var(--accent); }
  @media (max-width: 760px) {
    .hero { min-height: 40rem; }
    .hero::after { background: linear-gradient(90deg, rgba(10,10,10,0) 39%, rgba(10,10,10,.2) 51%, rgba(10,10,10,.84) 68%, #0A0A0A 82%); }
    .hero-copy { width: 50%; margin-right: var(--gutter); padding: 4rem .5rem 5rem; }
    .hero-copy h1 { font-size: clamp(2rem, 6vw, 3.6rem); }
    .floating-badge { left: var(--gutter); right: auto; bottom: .75rem; }
  }
  @media (max-width: 540px) {
    .hero { min-height: 44rem; align-items: flex-end; padding-bottom: 2rem; }
    .hero::after { background: linear-gradient(0deg, #0A0A0A 2%, rgba(10,10,10,.92) 34%, rgba(10,10,10,.18) 100%); }
    .hero-figure { bottom: auto; height: auto; aspect-ratio: 1584 / 672; }
    .hero-banner-art { object-fit: contain; }
    .hero-copy { width: 100%; margin: 0; padding: 2rem var(--gutter) 3rem; }
    .hero-copy h1, .hero-copy .lead, .hero-copy .eyebrow, .hero-copy .actions, .hero-copy .social-strip { position: relative; z-index: 2; }
    .floating-badge { display: none; }
  }
  .podcast-highlight .editorial-art { display: block; width: 100%; height: 100%; min-height: 20rem; object-fit: cover; object-position: center; }

  /* Blocks and lists */
  .block { padding: clamp(2rem, 5vw, 3.25rem) 0; border-top: 1px solid var(--line); }
  .block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; margin-bottom: 1rem; }
  .block-head h2 { margin: 0; }
  .block-head a { position: relative; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .74rem; }
  .block-head a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -0.2rem; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .2s ease; }
  .block-head a:hover::after { transform: scaleX(1); }
  .page-head { padding: clamp(2rem, 5vw, 3.5rem) 0 1.5rem; }
  .page-head h1, .hero-copy h1 { text-shadow: 3px 3px 0 rgba(242,242,242,0.12); }
  .now { margin: 0; }
  .now > div { display: grid; grid-template-columns: 10rem 1fr; gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--line); }
  .now dt { font-weight: 700; }
  .now dd { margin: 0; }
  @media (max-width: 600px) { .now > div { grid-template-columns: 1fr; gap: .1rem; } }

  .project { padding: 1.5rem 1.25rem 1.6rem; margin-top: 1rem; border: 1px solid var(--line); border-radius: 2px; background: #111; box-shadow: 4px 4px 0 rgba(242,242,242,0.08); }
  .project p { max-width: 66ch; }
  .project-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; margin-bottom: .5rem; }
  .project-head h2, .project-head h3 { margin: 0; }
  .status { margin: 0; font-size: .92rem; font-weight: 500; padding: .18rem .65rem; border: 1px solid var(--line); border-radius: 2px; background: transparent; }
  .status.live { color: var(--accent); border-color: rgba(0, 180, 255, 0.4); background: rgba(0, 180, 255, 0.08); }

  .media-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
  .feature-card { display: grid; gap: .7rem; padding: 1.15rem; border: 1px solid var(--line); border-radius: 2px; background: #111; box-shadow: 3px 3px 0 rgba(242,242,242,0.08); }
  .feature-card h3 { margin: 0; font-size: 1.15rem; }
  .feature-card p { margin: 0; color: var(--muted); }
  .feature-card .tag { display: inline-block; width: fit-content; padding: .25rem .6rem; border-radius: 2px; border: 1px solid rgba(0, 180, 255, 0.35); background: rgba(0, 180, 255, 0.06); color: var(--accent); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  .podcast-panel { display: grid; grid-template-columns: 1.1fr .9fr; gap: 1.4rem; align-items: stretch; margin-top: 1.5rem; }
  .podcast-highlight { position: relative; overflow: hidden; border-radius: 2px; border: 1px solid var(--line); background: #0A0A0A; box-shadow: 4px 4px 0 rgba(242,242,242,0.08); }
  .podcast-highlight .editorial-art { display: block; width: 100%; height: 100%; min-height: 22rem; object-fit: cover; object-position: center; margin: 0; }
  .podcast-copy { padding: 1.4rem; display: flex; flex-direction: column; justify-content: center; }
  .podcast-copy h3 { margin: 0 0 .4rem; }
  .podcast-copy p { margin: 0 0 1rem; color: var(--muted); }
  .section-label {
    display: inline-block; transform: rotate(-2deg); margin-bottom: 1rem; padding: .35rem .8rem;
    border: 1px solid var(--line); background: rgba(0, 180, 255, 0.05); color: var(--fg);
    font-family: var(--marker); letter-spacing: .04em; font-size: .8rem; text-transform: uppercase;
  }
  @media (max-width: 820px) { .podcast-panel { grid-template-columns: 1fr; } }
  .facts { margin: 1rem 0 0; display: grid; gap: .3rem; }
  .facts > div { display: grid; grid-template-columns: 6.5rem 1fr; gap: 1rem; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }

  .post-row { padding: 1.35rem 1.15rem; border: 1px solid var(--line); border-radius: 2px; background: #111; box-shadow: 3px 3px 0 rgba(242,242,242,0.07); }
  .post-row + .post-row { margin-top: 1rem; }
  .post-row h2, .post-row h3 { font-size: 1.4rem; margin: 0 0 .35rem; }
  .post-row h2 a, .post-row h3 a { color: var(--fg); text-decoration: none; }
  .post-row h2 a:hover, .post-row h3 a:hover { text-decoration: underline; }
  .post-row p { max-width: 66ch; margin-bottom: .6rem; }
  .meta { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; color: var(--muted); font-size: .95rem; margin-bottom: .6rem; }
  .tags { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; padding: 0; margin: 0; }
  .tags li { font-size: .88rem; padding: .05rem .55rem; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: end; margin-bottom: .5rem; }
  .field { display: grid; gap: .35rem; margin-bottom: 1rem; }
  .field label { font-weight: 500; }
  .episode-card {
    display: grid; gap: 1rem; padding: 1.2rem; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); box-shadow: 4px 4px 0 rgba(242,242,242,0.08);
    position: relative;
  }
  .episode-card::before {
    content: ""; position: absolute; left: -8px; right: -8px; top: 12px; bottom: 12px; border-top: 1px solid rgba(242,242,242,0.14); border-bottom: 1px solid rgba(242,242,242,0.14); transform: skewY(-1deg); pointer-events: none;
  }
  .episode-card .episode-top { display: grid; grid-template-columns: 160px 1fr; gap: 1rem; position: relative; z-index: 1; }
  .episode-art { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--line); overflow: hidden; }
  .episode-art .editorial-art { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 28% center; }
  .episode-number { color: var(--accent); font-family: var(--mono); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .episode-meta { color: var(--muted); font-size: .85rem; }
  .podcast-player { position: relative; z-index: 1; }
  .podcast-player audio { width: 100%; }
  .transcript { position: relative; z-index: 1; padding: 1rem 0 0; border-top: 1px solid var(--line); }
  .transcript code { color: var(--fg); }
  input[type="text"], input[type="email"], input[type="search"], textarea {
    font: inherit; padding: .65rem .8rem; border: 2px solid var(--field); background: var(--bg); color: var(--fg); border-radius: 6px; width: 100%; }
  textarea { min-height: 9rem; resize: vertical; }
  .search { width: min(22rem, 100%); }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { font: inherit; border: 2px solid var(--line); background: transparent; color: var(--fg); padding: .25rem .85rem; border-radius: 6px; cursor: pointer; }
  .chip:hover { border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .count { color: var(--muted); margin: .5rem 0 0; font-size: .95rem; }
  .empty { padding: 1.5rem 0; border-top: 1px solid var(--line); }

  /* Articles */
  .prose { max-width: 66ch; }
  .prose h2 { margin-top: 2.2rem; }
  .prose h3 { margin-top: 1.6rem; }
  .prose pre { background: var(--surface); padding: 1rem; border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: 1rem; line-height: 1.5; margin: 0 0 1.25em; }
  .prose code { font-family: var(--mono); background: var(--surface); padding: .1em .35em; border-radius: 4px; font-size: .95em; }
  .prose pre code { background: none; padding: 0; }
  .prose li { margin-bottom: .5rem; }
  .table-wrap { overflow-x: auto; margin: 0 0 1.5em; }
  .table-wrap table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: .98rem; line-height: 1.45; }
  .table-wrap th { text-align: left; border-bottom: 2px solid var(--fg); padding: .55rem .75rem; }
  .table-wrap td { border-bottom: 1px solid var(--line); padding: .6rem .75rem; vertical-align: top; }
  .back { display: inline-block; margin: 2rem 0 1rem; }
  .article-head { max-width: 66ch; margin-bottom: 2rem; }
  .article-head h1 { font-size: clamp(1.9rem, 1.2rem + 2.6vw, 3rem); }
  .pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1.5rem; max-width: 66ch; }
  .pager a { max-width: 20rem; }
  .pager small { display: block; color: var(--muted); }

  /* Skills */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 2rem; }
  .cols h3 { margin-bottom: .1rem; }
  .cols .sub { color: var(--muted); margin-bottom: .75rem; font-size: .95rem; }
  .plain { list-style: none; padding: 0; margin: 0; }
  .plain li { padding: .55rem 0; border-top: 1px solid var(--line); }
  .roadmap { list-style: none; margin: 1rem 0 0; padding: 0 0 0 1.75rem; border-left: 2px solid var(--line); max-width: 44rem; }
  .roadmap li { position: relative; padding: 0 0 2rem; }
  .roadmap li::before { content: ""; position: absolute; left: calc(-1.75rem - 9px); top: .4rem; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--link); background: var(--bg); }
  .roadmap li.active::before { background: var(--accent); }
  .roadmap h3 { margin-bottom: .1rem; }
  .roadmap .st { font-weight: 500; color: var(--link); margin-bottom: .4rem; }

  /* Contact */
  .contact-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: clamp(2rem, 5vw, 4rem); }
  @media (max-width: 800px) { .contact-grid { grid-template-columns: 1fr; } }
  .note { color: var(--muted); font-size: .95rem; }
  .sent { margin-top: 1rem; padding: .9rem 1rem; border-left: 4px solid var(--link); background: var(--surface); }

  /* Footer */
  .site-footer { border-top: 1px solid var(--line); margin-top: 3rem; background: #0A0A0A; }

      slug: 'osi-model-attack-map',
      title: 'The OSI model is also a map of attacks',
      date: '2026-09-18',
      tags: ['Networking', 'Security'],
      summary: 'Each network layer has its own typical attacks and its own defences. This is the map I use while studying for Network+.',
      body: '' +
        '<p>When I started the networking chapters for Network+, the OSI model felt like a list to memorise. It clicked when I paired each layer with the way it gets attacked and the control that stops that attack. Now the seven layers double as a checklist for where to look when something goes wrong.</p>' +
        '<div class="table-wrap"><table>' +
        '<thead><tr><th>Layer</th><th>What it does</th><th>Typical attack</th><th>A defence that fits</th></tr></thead><tbody>' +
        '<tr><td>7 Application</td><td>Where apps and users meet the network</td><td>SQL injection, cross-site scripting</td><td>Input validation, patching, a web application firewall</td></tr>' +
        '<tr><td>6 Presentation</td><td>Formats and encrypts data</td><td>SSL stripping, downgrade attacks</td><td>Modern TLS, HSTS</td></tr>' +
        '<tr><td>5 Session</td><td>Opens, maintains and closes conversations</td><td>Session hijacking</td><td>Unpredictable session tokens, short timeouts</td></tr>' +
        '<tr><td>4 Transport</td><td>Delivers data between hosts</td><td>SYN flood, port scanning</td><td>SYN cookies, stateful firewalls</td></tr>' +
        '<tr><td>3 Network</td><td>Routes packets between networks</td><td>IP spoofing, ICMP floods</td><td>Ingress filtering, access control lists</td></tr>' +
        '<tr><td>2 Data link</td><td>Moves frames on the local network</td><td>ARP spoofing, MAC flooding</td><td>Dynamic ARP inspection, port security</td></tr>' +
        '<tr><td>1 Physical</td><td>Sends signals over cable or radio</td><td>Wiretapping, rogue devices</td><td>Locked cabinets, disabled unused ports</td></tr>' +
        '</tbody></table></div>' +
        '<h2>Why the layers matter</h2>' +
        '<p>A fix at one layer rarely covers another. A firewall tuned for layer 4 will not stop SQL injection, and a well-written web application will not help if someone can plug a rogue switch into an open wall port.</p>' +
        '<h2>How I use it</h2>' +
        '<p>When I read about a breach, I ask two questions: which layer did the attacker actually work at, and which layer\'s control failed? Often the answer is not the layer that makes the headlines.</p>' +

      summary: 'Linux is a kernel; what you install is a distribution. The family a distribution belongs to decides how you patch it, harden it and audit it.',
      body: '' +
        '<p>Linux is technically just a kernel. What you actually install is a distribution: the kernel plus tools, a package manager, default settings and a release policy. Distributions cluster into families, and the family tells you a lot about how a system will behave.</p>' +
        '<h2>The families I keep meeting</h2>' +
        '<ul>' +
        '<li><strong>Debian family</strong> (Debian, Ubuntu, Kali): <code>.deb</code> packages, managed with <code>apt</code>.</li>' +
        '<li><strong>Red Hat family</strong> (RHEL, Fedora, Rocky Linux, AlmaLinux): <code>.rpm</code> packages, managed with <code>dnf</code>.</li>' +
        '<li><strong>Others</strong> such as Arch and SUSE, each with their own tools.</li>' +
        '</ul>' +
        '<p>Kali Linux is built on Debian, so what you learn about <code>apt</code>, file locations and services on Debian carries straight over to it.</p>' +
        '<h2>The same job in two dialects</h2>' +
        '<pre><code># Debian family\nsudo apt update\nsudo apt upgrade\n\n# Red Hat family\nsudo dnf upgrade</code></pre>' +
        '<h2>Why this matters for security</h2>' +
        '<p>Patching is the first line of defence, and the tool you patch with depends on the family. Default hardening differs too: Red Hat family systems ship with SELinux enforcing, while Ubuntu leans on AppArmor. Knowing which one you are looking at tells you where to look when a service is blocked, or when an attack has been contained.</p>' +
        '<h2>Where the certifications fit</h2>' +
        '<p>RHCSA and RHCE are built around the Red Hat family. CompTIA Linux+ is vendor neutral and touches both. Kali is where a lot of penetration testing happens and Red Hat systems are common in enterprises, so I am learning both dialects.</p>'
    },
    {
      slug: 'seven-jobs-of-an-os',
      title: 'Seven jobs of an operating system, and how each one gets attacked',
      date: '2026-09-04',
      tags: ['Linux', 'Security'],
      summary: 'Every core function of an operating system doubles as an attack surface. Here is the list I walk through when I look at a Linux machine.',
      body: '' +
        '<p>Textbooks slice the responsibilities of an operating system in slightly different ways. This is the version I use, because each job maps neatly onto something an attacker wants.</p>' +
        '<ul>' +
        '<li><strong>Process management</strong> decides which programs run and with what privileges. Attackers look for privilege escalation, for example through misconfigured setuid programs.</li>' +
        '<li><strong>Memory management</strong> keeps processes out of each other\'s memory. Buffer overflows are what happens when that wall has a hole.</li>' +
        '<li><strong>The file system</strong> organises data and permissions. Loose permissions and path traversal are the classic problems.</li>' +
        '<li><strong>Device management</strong> talks to hardware. A malicious USB device is an attack on this layer.</li>' +
        '<li><strong>Networking</strong> opens sockets and runs services. Exposed ports and unencrypted traffic are the attack surface.</li>' +
        '<li><strong>Security and access control</strong> covers users, groups and authentication. Weak passwords and over-broad sudo rules live here.</li>' +
        '<li><strong>The user interface</strong>, mostly the shell on a server. Command injection through unsanitised input is the main risk.</li>' +
        '</ul>' +
        '<h2>Turning the list into a habit</h2>' +
        '<p>For any Linux system I walk the list and ask what I would check at each step. On Linux the answers mostly start at the command line, which is why the shell and filesystem chapters come before the desktop ones in my study plan.</p>' +
        '<pre><code>ps aux                          # what is running, and as whom\nls -l /etc/passwd /etc/shadow   # who can read the sensitive files\nss -tulpn                       # which ports are listening\nfind / -perm -4000 2>/dev/null  # setuid programs to review</code></pre>' +
        '<p>Only run checks like these on machines you own or have permission to audit.</p>'
    },
    {
      slug: 'how-i-study',
      title: 'How I study: analogy, attack, practice',

  function blog() {
    var tags = ['All'];
    posts.forEach(function (p) { p.tags.forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); }); });
    return {
      title: 'Blog',
      html:
        '<div class="page-head"><h1>Blog</h1><p class="lead">Notes from what I\'m studying and building.</p></div>' +
        '<div class="controls">' +
          '<div class="field search" style="margin:0"><label for="q">Search posts</label><input id="q" type="search" value="' + blogState.q.replace(/"/g, '&quot;') + '"></div>' +
          '<div class="filters" role="group" aria-label="Filter by topic">' +
            tags.map(function (t) { return '<button class="chip" type="button" data-tag="' + t + '" aria-pressed="' + (t === blogState.tag) + '">' + t + '</button>'; }).join('') +
          '</div>' +
        '</div>' +
        '<p class="count" id="postCount" aria-live="polite"></p>' +
        '<div id="postList"></div>',
      after: function () {
        function filtered() {
          var q = blogState.q.toLowerCase();
          return posts.filter(function (p) {
            var okTag = blogState.tag === 'All' || p.tags.indexOf(blogState.tag) >= 0;
            var okQ = !q || (p.title + ' ' + p.summary + ' ' + strip(p.body)).toLowerCase().indexOf(q) >= 0;
            return okTag && okQ;
          });
        }
        function paint() {
          var list = filtered();
          $('#postList').innerHTML = list.length
            ? list.map(function (p) { return postRow(p, 'h2'); }).join('')
            : '<p class="empty">No posts match that search. <button class="linkbtn" type="button" id="clearFilters">Clear the search and filter</button></p>';
          $('#postCount').textContent = list.length + (list.length === 1 ? ' post' : ' posts');
          var c = $('#clearFilters');
          if (c) c.addEventListener('click', function () {
            blogState = { q: '', tag: 'All' };
            $('#q').value = '';
            $$('.chip').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tag === 'All')); });
            paint();
          });
        }
        $('#q').addEventListener('input', function (e) { blogState.q = e.target.value; paint(); });
        $$('.chip').forEach(function (b) {
          b.addEventListener('click', function () {
            blogState.tag = b.dataset.tag;
            $$('.chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
            paint();
          });
        });
        paint();
      }
    };
  }

  function post(slug) {
    var i = -1;
    posts.forEach(function (p, n) { if (p.slug === slug) i = n; });
    if (i < 0) return notFound();
    var p = posts[i], newer = posts[i - 1], older = posts[i + 1];
    return {
      title: p.title,
      html:
        '<a class="back" href="#/blog">All posts</a>' +
        '<header class="article-head"><h1>' + p.title + '</h1>' +
          '<p class="meta"><time datetime="' + p.date + '">' + fmtDate(p.date) + '</time><span>' + mins(p.body) + ' min read</span></p>' +
          tagList(p.tags) + '</header>' +
        '<article class="prose">' + p.body + '</article>' +
        '<nav class="pager" aria-label="More posts">' +
          (older ? '<a href="#/blog/' + older.slug + '"><small>Older post</small>' + older.title + '</a>' : '<span></span>') +
          (newer ? '<a href="#/blog/' + newer.slug + '" style="text-align:right"><small>Newer post</small>' + newer.title + '</a>' : '') +
        '</nav>'
    };
  }

  function contact() {
    var links = '<li><a href="' + CONFIG.github + '" target="_blank" rel="noopener">GitHub: ' + CONFIG.handle + '</a></li>';
    if (CONFIG.linkedin) links += '<li><a href="' + CONFIG.linkedin + '" target="_blank" rel="noopener">LinkedIn</a></li>';
    if (CONFIG.x) links += '<li><a href="' + CONFIG.x + '" target="_blank" rel="noopener">X / Twitter</a></li>';
    if (CONFIG.youtube) links += '<li><a href="' + CONFIG.youtube + '" target="_blank" rel="noopener">YouTube</a></li>';
    if (CONFIG.podcast) links += '<li><a href="' + CONFIG.podcast + '" target="_blank" rel="noopener">Podcast</a></li>';
    links += '<li><a href="mailto:' + CONFIG.email + '">' + CONFIG.email + '</a></li>';
    return {
      title: 'Contact',
      html:
        '<div class="page-head"><h1>Get in touch</h1><p class="lead">I\'m interested in internships, junior roles and collaboration on security or web projects.</p></div>' +
        '<div class="contact-grid">' +
          '<div><h2>Find me online</h2><ul class="plain">' + links + '</ul></div>' +
          '<div><h2>Send a message</h2>' +
            '<form id="contactForm">' +
              '<div class="field"><label for="cName">Your name</label><input id="cName" type="text" autocomplete="name" required></div>' +
              '<div class="field"><label for="cEmail">Your email</label><input id="cEmail" type="email" autocomplete="email" required></div>' +
              '<div class="field"><label for="cMsg">Message</label><textarea id="cMsg" required></textarea></div>' +
              '<button class="btn" type="submit">Open in my email app</button>' +
              '<p class="note" style="margin-top:1rem">This opens your email app with the message filled in. Nothing is sent from this page.</p>' +
              '<div id="sent" class="sent" hidden></div>' +
            '</form>' +
          '</div>' +
        '</div>',
      after: function () {
        $('#contactForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var name = $('#cName').value.trim(), from = $('#cEmail').value.trim(), msg = $('#cMsg').value.trim();
          var subject = 'Message from ' + name + ' via your site';
          var body = msg + '\n\n' + name + '\n' + from;
          var url = 'mailto:' + CONFIG.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
          var a = document.createElement('a'); a.href = url; document.body.appendChild(a); a.click(); a.remove();
          var s = $('#sent');
          s.hidden = false;
          s.textContent = 'If your email app did not open, write to ' + CONFIG.email + ' directly.';
        });
      }
    };
  }

  function notFound() {
    return {
      title: 'Page not found',
      html: '<div class="page-head"><h1>Page not found</h1><p class="lead">That page does not exist or has moved.</p><div class="actions"><a class="btn" href="#/">Go home</a><a class="btn ghost" href="#/blog">Browse the blog</a></div></div>'
    };
  }

  /* ----- Terminal ----- */
  var introPlayed = false;
  var PAGES = ['home', 'podcast', 'blog', 'about', 'contact'];
  var WHOAMI = [
    'fixerctrl',
    'role      young South African IT student',
    'roots     township raised',
    'focus     ethical cybersecurity and development',
    'studying  CompTIA Network+, Linux',
    'building  Neuroband Intelligence Hub, Mini Circles'
  ];
  var NOW = [
    'studying   CompTIA Network+',
    'reading    Linux Bible, 10th edition',
    'building   Neuroband Intelligence Hub',
    'next up    a Linux certification (RHCSA/RHCE or Linux+)'
  ];
  var HELP = [
    'Commands:',
    '  whoami        who I am',
    '  ls            list the pages',
    '  cat now       what I am working on',
    '  open <page>   go to a page',
    '  clear         clear the screen'
  ];

  function initTerminal() {
    var body = $('#termBody'), log = $('#termLog'), form = $('#termForm'), input = $('#termInput');
    var history = [], hIndex = 0, busy = false;

    function line(text, cls) {
      var p = document.createElement('p');
      p.className = 'tl' + (cls ? ' ' + cls : '');
      p.textContent = text;
      log.appendChild(p);
      return p;
    }
    function out(lines, cls) { lines.forEach(function (t) { line(t, cls); }); body.scrollTop = body.scrollHeight; }
    function echo(cmd) {
      var p = document.createElement('p');
      p.className = 'tl';
      var pr = document.createElement('span'); pr.className = 'pr'; pr.textContent = '$ ';
      p.appendChild(pr); p.appendChild(document.createTextNode(cmd));
      log.appendChild(p);
      return p;
    }

    function run(raw) {
      var cmd = raw.trim();
      if (!cmd) return;
      echo(cmd);
      var parts = cmd.split(/\s+/), name = parts[0].toLowerCase(), arg = (parts[1] || '').toLowerCase();
      switch (name) {
        case 'help': out(HELP); break;
        case 'whoami': out(WHOAMI); break;
        case 'ls': out([PAGES.join('  ')]); break;
        case 'cat':
          if (!arg) out(['cat: missing file. Try: cat now']);
          else if (arg === 'now') out(NOW);
          else out(['cat: ' + parts[1] + ': No such file or directory']);
          break;
        case 'open':
        case 'cd':
          if (PAGES.indexOf(arg) >= 0) {
            out(['opening ' + arg + '...'], 'dim');
            location.hash = arg === 'home' ? '#/' : '#/' + arg;
          } else out([name + ': ' + (parts[1] || '') + ': no such page. Try ls']);
          break;
        case 'clear': log.innerHTML = ''; break;
        case 'sudo': out(['visitor is not in the sudoers file. This incident will be reported.']); break;
        default: out([parts[0] + ': command not found. Type help for a list.']);
      }
      body.scrollTop = body.scrollHeight;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;
      var v = input.value;
      if (v.trim()) { history.push(v); hIndex = history.length; }
      input.value = '';
      run(v);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp' && history.length) { e.preventDefault(); hIndex = Math.max(0, hIndex - 1); input.value = history[hIndex]; }
      if (e.key === 'ArrowDown' && history.length) { e.preventDefault(); hIndex = Math.min(history.length, hIndex + 1); input.value = history[hIndex] || ''; }
    });
    $$('[data-cmd]').forEach(function (b) {
      b.addEventListener('click', function () { if (!busy) run(b.dataset.cmd); });
    });

    line('fixerctrl terminal. Type help, or tap a command below.', 'dim');

    if (introPlayed || reduceMotion) {
      echo('whoami'); out(WHOAMI); introPlayed = true;
      return;
    }
    // One orchestrated moment: type the first command, then print the result.
    busy = true;
    var p = echo('');
    var span = document.createTextNode('');
    p.appendChild(span);
    var text = 'whoami', n = 0;
    setTimeout(function tick() {
      if (!document.body.contains(p)) { busy = false; return; }
      n++;
      span.nodeValue = text.slice(0, n);
      if (n < text.length) setTimeout(tick, 85);
      else setTimeout(function () { out(WHOAMI); introPlayed = true; busy = false; }, 250);
    }, 500);
  }

  /* ----- Router ----- */
  var first = true;
  function render() {
    var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    var page = parts[0] || 'home', view;
    if (page === 'home') view = home();
    else if (page === 'podcast') view = podcast();
    else if (page === 'about') view = about();
    else if (page === 'projects') view = projects();
    else if (page === 'skills') view = skills();
    else if (page === 'blog') view = parts[1] ? post(parts[1]) : blog();
    else if (page === 'contact') view = contact();
    else view = notFound();

    main.innerHTML = '<div class="wrap">' + view.html + '</div>';
    document.title = (view.title === 'Home' ? 'FixerCtrl | Cybersecurity and development' : view.title + ' | FixerCtrl');
    $$('.main-nav a').forEach(function (a) {
      if (a.dataset.nav === page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    $('#siteHeader').classList.remove('open');
    $('#menuBtn').setAttribute('aria-expanded', 'false');
    $('#menuBtn').setAttribute('aria-label', 'Open menu');
    window.scrollTo(0, 0);
    if (!first) main.focus({ preventScroll: true });
    first = false;
    if (view.after) view.after();
  }

  /* ----- Chrome: menu, footer ----- */
  $('#menuBtn').addEventListener('click', function () {
    var h = $('#siteHeader'), open = !h.classList.contains('open');
    h.classList.toggle('open', open);
    this.setAttribute('aria-expanded', String(open));
    this.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#siteHeader').classList.contains('open')) { $('#menuBtn').click(); $('#menuBtn').focus(); }
  });

  $('#yr').textContent = new Date().getFullYear();
  var foot = '<li><a href="' + CONFIG.github + '" target="_blank" rel="noopener">GitHub</a></li>';
  if (CONFIG.linkedin) foot += '<li><a href="' + CONFIG.linkedin + '" target="_blank" rel="noopener">LinkedIn</a></li>';
  if (CONFIG.x) foot += '<li><a href="' + CONFIG.x + '" target="_blank" rel="noopener">X</a></li>';
  if (CONFIG.youtube) foot += '<li><a href="' + CONFIG.youtube + '" target="_blank" rel="noopener">YouTube</a></li>';
  foot += '<li><a href="#/blog">Blog</a></li><li><a href="#/contact">Contact</a></li>';
  $('#footLinks').innerHTML = foot;

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
